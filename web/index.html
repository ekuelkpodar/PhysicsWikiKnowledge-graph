<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Physics Family Tree: who trained whom, where they moved, and who got recognized, across 12,000 physicists on Wikidata." />
    <meta name="theme-color" content="#0b0f14" />
    <title>The Physics Family Tree</title>
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
